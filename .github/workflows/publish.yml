name: Prepare Windows download release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Sebii1998/edubase-to-pdf-ocr'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft for direct binary uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; retaining its current assets and state.'
          else
            gh release create v1.6.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Edubase PDF + OCR v1.6.0 — Windows" --notes-file RELEASE_NOTES.md
          fi
