name: Prepare Windows download release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Sebii1998/edubase-to-pdf-ocr'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft for direct binary uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; retaining its current assets and state.'
          else
            gh release create v1.7.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "Edubase PDF + OCR v1.7.0 — Windows" --notes-file RELEASE_NOTES.md
          fi
      - name: Prepare checksum and unchanged add-on packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.parse, urllib.request, zipfile
          expected = {
              'Edubase-PDF-Windows.zip': (243965222, '08fa75d7bb5c89b6cc03bf87d2b62015d8d936884dc598516a76a1868c655a3d'),
              'Edubase-Mathe-OCR-Windows.zip': (574549116, '32da1ebaef1c3c28bd12de20a5505ab0baff7a47202b8ee9fb6fecf914468993'),
              'Edubase-GPU-OCR-Windows.zip': (22817570, 'a4f4d094eddd44c97e4429714b63aba6cc7ac94560dae048eaa7b2c3444336b4'),
          }
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-v170'
          root.mkdir()
          for name, (size, sha) in expected.items():
              if name == 'Edubase-PDF-Windows.zip':
                  continue
              source = 'https://github.com/Sebii1998/edubase-to-pdf-ocr/releases/download/v1.6.0/' + name
              target = root / name
              digest, received = hashlib.sha256(), 0
              with urllib.request.urlopen(source, timeout=60) as response, target.open('xb') as output:
                  assert response.status == 200
                  while chunk := response.read(1024 * 1024):
                      received += len(chunk)
                      assert received <= size
                      digest.update(chunk)
                      output.write(chunk)
              assert (received, digest.hexdigest()) == (size, sha), name + ': checksum mismatch'
              with zipfile.ZipFile(target) as archive:
                  assert archive.testzip() is None, name + ': corrupt ZIP member'
              print('Verified ' + name + ': ' + sha, flush=True)
          sums = ''.join(sha + '  ' + name + '\r\n' for name, (_, sha) in expected.items()).encode('utf8')
          assert len(sums) == 283 and hashlib.sha256(sums).hexdigest() == '03b0631ee27ceb8c7d9ad3f0a812166f70da9d1528af0755b08adf31a29a8655'
          (root / 'SHA256SUMS.txt').write_bytes(sums)
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', 'v1.7.0', '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'isDraft,assets'], text=True))
          assert release['isDraft'], 'Only the unpublished draft may be populated automatically.'
          assert not release['assets'], 'Keep existing assets intact; review an already populated draft manually.'
          subprocess.run(['gh', 'release', 'upload', 'v1.7.0', '--repo', os.environ['GITHUB_REPOSITORY'], *[str(root / name) for name in ['Edubase-Mathe-OCR-Windows.zip', 'Edubase-GPU-OCR-Windows.zip', 'SHA256SUMS.txt']]], check=True)
          print('Unchanged add-ons and the pinned checksum file uploaded to the v1.7.0 draft; the approved application archive is uploaded separately.', flush=True)

